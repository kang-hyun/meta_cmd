low_temp_driver:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 500000
    wheel_radius: 0.15
    wheel_separation: 0.60
    max_wheel_speed: 20.0
    control_rate: 20.0
    cmd_vel_timeout: 0.5
    cmd_vel_topic: cmd_vel
    motor_state_topic: motor_state
    wheel_command_topic: wheel_command
    status_period: 1.0
